<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | SPEEDERS</title>
    <style>
        :root {
            --navy: #061a2d;
            --gold: #c9a56a;
            --gold-soft: #e0c18d;
            --white: #ffffff;
            --muted: #a9b8c7;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 25px;
            color: var(--white);
            background: linear-gradient(135deg, #041321, #0b2a45);
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            width: min(100%, 420px);
            padding: 35px;
            border: 1px solid rgba(201, 165, 106, 0.35);
            border-radius: 14px;
            background: rgba(8, 33, 54, 0.94);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.26);
        }
        .brand {
            color: var(--gold-soft);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 5px;
            text-align: center;
        }
        h1 { margin: 24px 0 8px; text-align: center; font-size: 26px; }
        .subtitle { margin: 0 0 24px; color: var(--muted); text-align: center; font-size: 14px; }
        label { display: block; margin: 16px 0 7px; color: var(--gold-soft); font-size: 13px; font-weight: 700; }
        input {
            width: 100%;
            padding: 11px 12px;
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 7px;
            outline: none;
            background: rgba(255, 255, 255, 0.06);
        }
        input:focus { border-color: var(--gold); }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            color: var(--navy);
            border: 0;
            border-radius: 7px;
            background: var(--gold);
            cursor: pointer;
            font-weight: 700;
        }
        .error { margin-top: 15px; padding: 10px; color: #ffd5d5; border-radius: 6px; background: rgba(170, 40, 40, 0.25); font-size: 13px; }
        .bottom-link { margin: 21px 0 0; color: var(--muted); text-align: center; font-size: 14px; }
        a { color: var(--gold-soft); }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">SPEEDERS</div>
        <h1>Giriş Yap</h1>
        <p class="subtitle">ERP çalışma alanınıza erişin.</p>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="error">{{ form.non_field_errors }}</div>
            {% endif %}
            <label for="id_username">Kullanıcı adı</label>
            {{ form.username }}
            <label for="id_password">Şifre</label>
            {{ form.password }}
            <button type="submit">Giriş Yap</button>
        </form>
        <p class="bottom-link">Hesabınız yok mu? <a href="{% url 'register' %}">Üye olun</a></p>
    </main>
</body>
</html>
